[build]
publish = "."
command = "npm ci && cd netlify/functions && npm ci"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

[dev]
  port = 8888
  targetPort = 4000
  framework = "#static"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200